<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
    <defs>
        <linearGradient id="sbBg" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#059669"/>
            <stop offset="60%" stop-color="#047857"/>
            <stop offset="100%" stop-color="#065f46"/>
        </linearGradient>
        <linearGradient id="leafGlow" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#6ee7b7"/>
            <stop offset="100%" stop-color="#10b981"/>
        </linearGradient>
        <linearGradient id="sunGlow" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#fef08a"/>
            <stop offset="100%" stop-color="#f59e0b"/>
        </linearGradient>
    </defs>

    <!-- Background Squircle (Rounded Square) -->
    <rect width="512" height="512" rx="120" fill="url(#sbBg)"/>
    <rect x="10" y="10" width="492" height="492" rx="112" stroke="#34d399" stroke-opacity="0.3" stroke-width="8" fill="none"/>

    <!-- Subtle Earth Latitude/Longitude Ring -->
    <ellipse cx="256" cy="270" rx="150" ry="60" stroke="#a7f3d0" stroke-opacity="0.25" stroke-width="8" stroke-dasharray="16 12" fill="none"/>

    <!-- Left Embracing Leaf (Siaga Bumi - Nature & Ecology) -->
    <path d="M 240,380 C 170,370 120,320 125,250 C 130,175 190,130 256,110 C 250,160 220,210 190,250 C 165,285 180,340 240,380 Z" fill="#ecfdf5" fill-opacity="0.95"/>

    <!-- Right Embracing Leaf (SSK Family & Community Care) -->
    <path d="M 272,380 C 342,370 392,320 387,250 C 382,175 322,130 256,110 C 262,160 292,210 322,250 C 347,285 332,340 272,380 Z" fill="url(#leafGlow)"/>

    <!-- Central Growing Shoot / Family Figure (Generasi Berencana - GenRe) -->
    <path d="M 256,380 C 252,310 245,240 256,180 C 267,240 260,310 256,380 Z" fill="#ffffff"/>

    <!-- Head / Youth Sphere of Enlightenment -->
    <circle cx="256" cy="155" r="34" fill="#ffffff"/>

    <!-- Golden Sun of Hope / Masa Depan Cerah (Top Right) -->
    <circle cx="340" cy="120" r="22" fill="url(#sunGlow)"/>
    <g stroke="#f59e0b" stroke-width="4" stroke-linecap="round">
        <line x1="340" y1="88" x2="340" y2="78"/>
        <line x1="340" y1="152" x2="340" y2="162"/>
        <line x1="308" y1="120" x2="298" y2="120"/>
        <line x1="372" y1="120" x2="382" y2="120"/>
    </g>
</svg>